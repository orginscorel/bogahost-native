<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Çevrimdışı — Bogahost</title>
  <meta name="theme-color" content="#0e1015">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background: #0e1015; color: #e6e8ee;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    }
    .card { max-width: 380px; }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 20px;
      background: linear-gradient(135deg, #5443D2, #6366f1);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 40px rgba(84,67,210,.35);
    }
    .logo svg { width: 38px; height: 38px; stroke: #fff; }
    h1 { font-size: 20px; font-weight: 700; margin: 0 0 8px; letter-spacing: -.01em; }
    p { font-size: 14px; line-height: 1.6; color: #9aa1b2; margin: 0 0 22px; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: #5443D2; color: #fff; font-size: 15px; font-weight: 600;
      padding: 12px 26px; border-radius: 12px; transition: opacity .15s, transform .1s;
    }
    button:hover { opacity: .92; } button:active { transform: scale(.98); }
    .status { margin-top: 16px; font-size: 12px; color: #6b7280; min-height: 16px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #f43f5e; margin-right: 6px; vertical-align: middle; }
    .dot.online { background: #10b981; }
    @media (prefers-color-scheme: light) {
      :root { color-scheme: light; }
      body { background: #f6f7fb; color: #1a1d26; }
      p { color: #6b7280; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>İnternet bağlantısı yok</h1>
    <p>Şu an çevrimdışısınız. Bağlantı geri geldiğinde uygulama otomatik olarak yüklenecek. Verileriniz güvende — hiçbir işlem kaybolmaz.</p>
    <button id="retry" type="button">Yeniden dene</button>
    <div class="status"><span class="dot" id="dot"></span><span id="txt">Bağlantı bekleniyor…</span></div>
  </div>
  <script>
    var dot = document.getElementById('dot'), txt = document.getElementById('txt');
    function sync() {
      if (navigator.onLine) { dot.classList.add('online'); txt.textContent = 'Bağlantı geldi — yeniden yükleniyor…'; location.reload(); }
      else { dot.classList.remove('online'); txt.textContent = 'Bağlantı bekleniyor…'; }
    }
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', sync);
    setInterval(function () { if (navigator.onLine) sync(); }, 4000);
  </script>
</body>
</html>
