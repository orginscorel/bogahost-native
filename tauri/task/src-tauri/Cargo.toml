[package]
name = "bogahost-task"
version = "1.6.0"
description = "Bogahost Görevler — Tauri v2 masaustu kabugu (canli URL WebView)"
authors = ["Bogahost"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# main.rs bu kutuphaneyi cagirir; Windows'ta isim cakismasini onlemek icin "_lib" son eki.
name = "bogahost_task_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
# Oturum acilisinda otomatik baslatma (macOS LaunchAgent / Windows Run anahtari).
# "Uygulama kapaliyken de bildirim gelsin" beklentisi pratikte BUNUNLA + tepside
# calisir kalmakla karsilanir; imzasiz uygulamada gercek APNs push YOKTUR.
tauri-plugin-autostart = "2"
# Tam otomatik guncelleme (indir + kur + yeniden baslat) — bkz. docs/UPDATE.md
tauri-plugin-updater = "2"
# Guncelleme onay diyalogu ("Simdi kur" / "Daha sonra").
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Surum denetimi (docs/UPDATE.md) icin HTTP istemcisi. Varsayilan TLS
# (Windows: schannel, macOS: Security.framework) — ek sistem bagimliligi yok.
reqwest = "0.12"

# Surum binary'sini kucult/optimize et.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
