<!doctype html>
<html lang="tr" data-bhx-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#5443D2" />
  <title>Bogahost Görevler</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0e1015;
      color: #e6e8ee;
      font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    .box { text-align: center; padding: 32px; }
    .name { font-size: 20px; font-weight: 600; letter-spacing: .2px; }
    .sub { margin-top: 8px; color: #9aa3b2; }
    .dot {
      width: 40px; height: 40px; margin: 0 auto 18px; border-radius: 12px;
      background: #5443D2;
      box-shadow: 0 0 0 6px rgba(84,67,210,.15);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(.9); opacity: .6 } }
  </style>
</head>
<body>
  <div class="box">
    <div class="dot"></div>
    <div class="name">Bogahost Görevler</div>
    <div class="sub">Baglaniliyor...</div>
  </div>
</body>
</html>
