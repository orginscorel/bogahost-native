<!doctype html>
<!--
  Yerel acilis splash SAYFASI (v1.9.5+).

  Ayri bir `splash` PENCERESI (bkz. lib.rs > build_splash_window) bu dosyayi
  yukler; uzak panel yuklenirken ANINDA boyanan yerel bir ekran gosterir,
  panel hazir olunca `reveal_window` ana pencereyi acip bu pencereyi kapatir.

  KARISTIRILMASIN: sonraki UYGULAMA-ICI gecislerin (link tiklama vb.) yukleme
  serit/katmani AYRI bir mekanizmadir — lib.rs > LOADING_OVERLAY_JS ile HEDEF
  (uzak) sayfaya `initialization_script` uzerinden cizilir, bu dosyayla ilgisi
  yoktur.

  Dosya `tauri.conf.json > build.frontendDist` tarafindan da isaret edilir;
  klasor bos olamaz.
-->
<html lang="tr" data-bhx-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#06b6d4" />
  <title>Bogahost Chat</title>
  <style>
    :root {
      --bg: #0e1015;
      --fg: #eef0f6;
      --muted: #8b93a4;
      --track: rgba(255, 255, 255, .09);
      --accent: #06b6d4;
      --accent-2: #22d3ee;
      --accent-glow: rgba(6,182,212, .30);
      --accent-ring: rgba(6,182,212, .16);
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7fb;
        --fg: #171a22;
        --muted: #6b7280;
        --track: rgba(15, 23, 42, .08);
        color-scheme: light;
      }
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-user-select: none; user-select: none;
      overflow: hidden;
    }

    .box {
      text-align: center; padding: 36px 40px;
      animation: enter .52s cubic-bezier(.22,.61,.36,1) both;
    }

    /* Isaret + donen "halka" gostergesi */
    .markWrap { position: relative; width: 108px; height: 108px; margin: 0 auto 26px; }
    .ring {
      position: absolute; inset: -12px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0deg, var(--accent) 120deg, transparent 200deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      animation: spin 1.15s linear infinite;
    }
    .ring::after {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      box-shadow: inset 0 0 0 1px var(--accent-ring);
    }
    .mark {
      position: absolute; inset: 16px;
      border-radius: 24px;
      background: linear-gradient(145deg, var(--accent-2), var(--accent));
      box-shadow: 0 16px 34px var(--accent-glow), 0 0 0 8px var(--accent-ring);
      display: flex; align-items: center; justify-content: center;
      animation: pulse 2.2s ease-in-out infinite;
    }
    .mark span { font-size: 38px; font-weight: 800; color: #fff; line-height: 1; letter-spacing: -.5px; }

    .name { font-size: 23px; font-weight: 700; letter-spacing: .2px; }
    .tagline { margin-top: 8px; font-size: 13.5px; color: var(--muted); }

    /* Ince belirsiz ilerleme cubugu (halkaya ek, ikinci bir ipucu) */
    .bar {
      position: relative; width: 172px; height: 3px; margin: 24px auto 0;
      border-radius: 99px; background: var(--track); overflow: hidden;
    }
    .bar::after {
      content: ''; position: absolute; top: 0; left: -40%; height: 100%; width: 40%;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: slide 1.2s linear infinite;
    }

    /* Alt: alan adi + surum rozeti */
    .domain {
      margin-top: 22px; font-size: 12px; letter-spacing: .3px; color: var(--muted); opacity: .85;
    }
    .badge {
      position: fixed; left: 0; right: 0; bottom: 14px;
      text-align: center; pointer-events: none;
      font-size: 11px; letter-spacing: .3px; color: var(--muted); opacity: 0;
      animation: fadeUp .5s ease .35s both;
    }
    .badge .dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin: 0 7px 1px; vertical-align: middle; }

    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .97 } 50% { transform: scale(.95); opacity: .82 } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slide { 0% { left: -40% } 100% { left: 100% } }
    @keyframes enter { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: .85; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .box { animation: none; }
      .mark { animation: none; }
      .ring { animation: none; opacity: .55; }
      .bar::after { animation: none; left: 0; width: 100%; opacity: .55; }
      .badge { animation: none; opacity: .85; }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="markWrap">
      <div class="ring"></div>
      <div class="mark"><span>C</span></div>
    </div>
    <div class="name">Bogahost Chat</div>
    <div class="tagline">Bağlanılıyor…</div>
    <div class="bar"></div>
    <div class="domain">bogahost.com</div>
  </div>

  <div class="badge" id="badge">Powered by Bogahost</div>

  <script>
    // Surum, Rust tarafindan initialization_script ile enjekte edilir.
    (function () {
      try {
        var v = window.__BOGAHOST_NATIVE_VERSION__;
        var el = document.getElementById('badge');
        if (v && el) {
          el.innerHTML = 'v' + v + '<span class="dot"></span>bogahost.com';
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
