<!doctype html>
<html lang="tr" data-bhx-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#5443D2" />
  <title>Bogahost Finans</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0e1015;
      color: #e6e8ee;
      font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-user-select: none; user-select: none;
      overflow: hidden;
    }
    .box { text-align: center; padding: 28px 32px; }

    /* Uygulama isareti */
    .mark {
      width: 54px; height: 54px; margin: 0 auto 18px;
      border-radius: 16px;
      background: linear-gradient(145deg, #6a58ea, #5443D2);
      box-shadow: 0 0 0 7px rgba(84,67,210,.13), 0 10px 26px rgba(84,67,210,.28);
      display: flex; align-items: center; justify-content: center;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .mark span { font-size: 25px; font-weight: 700; color: #fff; line-height: 1; }

    .name { font-size: 19px; font-weight: 600; letter-spacing: .2px; }
    .sub { margin-top: 7px; font-size: 13px; color: #9aa3b2; }

    /* Ince belirsiz ilerleme cubugu */
    .bar {
      position: relative; width: 190px; height: 3px; margin: 22px auto 0;
      border-radius: 99px; background: rgba(154,163,178,.16); overflow: hidden;
    }
    .bar::after {
      content: ''; position: absolute; top: 0; left: -40%; height: 100%; width: 40%;
      border-radius: 99px;
      background: linear-gradient(90deg, rgba(106,88,234,0), #6a58ea, rgba(106,88,234,0));
      animation: slide 1.15s linear infinite;
    }

    /* Surum + marka rozeti */
    .badge {
      position: fixed; left: 0; right: 0; bottom: 12px;
      text-align: center; pointer-events: none;
      font-size: 11px; letter-spacing: .3px; color: #6f7686;
    }

    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .96 } 50% { transform: scale(.93); opacity: .72 } }
    @keyframes slide { 0% { left: -40% } 100% { left: 100% } }

    @media (prefers-reduced-motion: reduce) {
      .mark { animation: none; }
      .bar::after { animation: none; left: 0; width: 100%; opacity: .55; }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark"><span>B</span></div>
    <div class="name">Bogahost Finans</div>
    <div class="sub">Yükleniyor…</div>
    <div class="bar"></div>
  </div>

  <div class="badge" id="badge">Powered by Bogahost</div>

  <script>
    // Surum, Rust tarafindan initialization_script ile enjekte edilir.
    (function () {
      try {
        var v = window.__BOGAHOST_NATIVE_VERSION__;
        var el = document.getElementById('badge');
        if (v && el) { el.textContent = 'v' + v + ' · Powered by Bogahost'; }
      } catch (e) {}
    })();
  </script>
</body>
</html>
