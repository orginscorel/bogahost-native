<!-- Bogahost Kasa — HIZLI ERİŞİM PANELİ.

     TEK TIK = DOLDUR.
     Bildirilen sorun: "doldura basmak çok zor, bazen araya basıyor". Doğruydu.
     Panelde üç ayrı hedef vardı — arama kutusu, satırlar, Doldur düğmesi — ve
     satıra tek tıklamak yalnızca SEÇİYORDU; doldurmak için ayrıca düğmeye ya
     da çift tıklamaya gerek vardı. 380 pikselin içinde üç hedef, ıskalanan tık
     demek.

     Şimdi: arama kutusu YOK (bu panel zaten yalnız EŞLEŞEN kayıtları
     gösteriyor, aranacak bir şey yok), satıra bir kez tıklamak dolduruyor.
     Satırlar büyük ve tam genişlikte — ıskalanacak boşluk kalmadı.

     KLAVYEYLE DE BİTİYOR: ↑/↓ ile seç, Enter ile doldur, Esc ile kapat. -->
<meta charset="utf-8">
<title>Kasa — Hızlı Erişim</title>
<style>
  :root{
    --kart:#ffffff; --kart2:#f7f6fc; --kart3:#eeecf8;
    --metin:#17162a; --sonuk:#5f5c78; --silik:#918ea8; --cizgi:#e4e1f1;
    --vurgu:#5443D2; --vurgu2:#7a6cf0; --vurgu-yumusak:rgba(84,67,210,.10);
    --iyi:#12905a; --uyari:#a9660a; --hata:#c02a45;
    --golge:0 10px 34px rgba(20,16,45,.20);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --kart:#17171f; --kart2:#1e1e29; --kart3:#262634;
      --metin:#eeedf6; --sonuk:#a3a1b5; --silik:#6e6c80; --cizgi:#2b2a3a;
      --vurgu:#8F86F0; --vurgu2:#a79ff5; --vurgu-yumusak:rgba(143,134,240,.16);
      --iyi:#4ecb8d; --uyari:#e8b45c; --hata:#f0788f;
      --golge:0 10px 34px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --kart:#17171f; --kart2:#1e1e29; --kart3:#262634;
    --metin:#eeedf6; --sonuk:#a3a1b5; --silik:#6e6c80; --cizgi:#2b2a3a;
    --vurgu:#8F86F0; --vurgu2:#a79ff5; --vurgu-yumusak:rgba(143,134,240,.16);
    --iyi:#4ecb8d; --uyari:#e8b45c; --hata:#f0788f;
    --golge:0 10px 34px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:transparent;overflow:hidden}
  body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
       color:var(--metin);-webkit-font-smoothing:antialiased}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .kabuk{height:100%;display:flex;flex-direction:column;background:var(--kart);
         border:1px solid var(--cizgi);border-radius:16px;box-shadow:var(--golge);overflow:hidden}

  /* ── Üst ── */
  .ust{display:flex;align-items:center;gap:9px;padding:11px 12px;
       border-bottom:1px solid var(--cizgi);background:var(--kart2);
       -webkit-app-region:drag;user-select:none}
  .nokta{width:8px;height:8px;border-radius:50%;background:var(--silik);flex:none}
  .nokta.canli{background:var(--iyi)}
  .hedef{flex:1;min-width:0}
  .hedefAd{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hedefAlt{font-size:11px;color:var(--silik);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kapat{-webkit-app-region:no-drag;width:26px;height:26px;display:grid;place-items:center;
         border:0;border-radius:8px;background:none;color:var(--silik);cursor:pointer;flex:none}
  .kapat:hover{background:var(--kart3);color:var(--metin)}
  .kapat svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

  /* ── Liste: SATIRIN TAMAMI TIKLANIR ── */
  .liste{flex:1;overflow-y:auto;padding:6px;min-height:0}
  .satir{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
         padding:12px 11px;border:0;border-radius:12px;background:none;color:inherit;
         font:inherit;cursor:pointer;transition:background .12s}
  .satir:hover,.satir.secili{background:var(--vurgu-yumusak)}
  .satir.secili{box-shadow:inset 3px 0 0 var(--vurgu)}
  .satir:active{transform:scale(.995)}
  .satir:disabled{opacity:.5;cursor:default}
  .avatar{width:34px;height:34px;border-radius:11px;flex:none;display:flex;align-items:center;
          justify-content:center;color:#fff;font-weight:700;font-size:13px}
  .metin{flex:1;min-width:0}
  .ad{display:block;font-weight:600;font-size:14px;line-height:1.35;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .alt{display:block;font-size:11.5px;line-height:1.35;color:var(--silik);
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .git{width:15px;height:15px;flex:none;stroke:var(--vurgu);fill:none;stroke-width:2.4;
       stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .12s}
  .satir:hover .git,.satir.secili .git{opacity:1}

  .bos{padding:30px 18px;text-align:center;color:var(--silik);font-size:12.5px;line-height:1.65}
  .bos b{display:block;color:var(--sonuk);font-size:13px;margin-bottom:5px}

  .durum{padding:0 13px;font-size:11.5px;color:var(--sonuk);min-height:0}
  .durum:not(:empty){padding:8px 13px}
  .durum.hata{color:var(--hata)}
  .durum.iyi{color:var(--iyi)}

  /* ── Alt: tıklama yolundan UZAK ── */
  .altCubuk{display:flex;align-items:center;gap:8px;padding:8px 12px;
            border-top:1px solid var(--cizgi);background:var(--kart2);font-size:11px;color:var(--silik)}
  .altCubuk label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .altCubuk input{accent-color:var(--vurgu);margin:0;width:13px;height:13px}
  .bosluk{flex:1}
  .gizli{display:none !important}
  kbd{font:600 10px/1 ui-monospace,monospace;background:var(--kart3);border:1px solid var(--cizgi);
      border-radius:4px;padding:2px 4px;color:var(--sonuk)}
</style>

<div class="kabuk">
  <div class="ust">
    <span class="nokta" id="nokta"></span>
    <div class="hedef">
      <div class="hedefAd" id="hedefAd">Hedef bekleniyor</div>
      <div class="hedefAlt" id="hedefAlt"></div>
    </div>
    <button class="kapat" id="kapat" title="Kapat (Esc)">
      <svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>

  <div class="liste" id="liste"></div>
  <div class="durum" id="durum"></div>

  <div class="altCubuk">
    <label id="enterSatir"><input type="checkbox" id="enterKutu" checked> Doldurunca Enter’a bas</label>
    <span id="eklentiNot" class="gizli">Tarayıcıda eklenti dolduruyor</span>
    <div class="bosluk"></div>
    <span><kbd>↑↓</kbd> <kbd>Enter</kbd> <kbd>Esc</kbd></span>
  </div>
</div>

<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
const pencereApi = window.__TAURI__.window;

const $ = (id) => document.getElementById(id);
let gosterilen = [], secili = null, hedefSon = null, dolduruluyor = false;

function renk(ad){ let h=0; for(let i=0;i<ad.length;i++) h=(h*31+ad.charCodeAt(i))%360; return 'hsl('+h+' 48% 45%)'; }
function basHarf(ad){ const p=ad.trim().split(/\s+/); return ((p[0]||'?').charAt(0)+((p[1]||'').charAt(0))).toUpperCase(); }
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
function alanAdi(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return (u||'').slice(0,40); } }
function durumYaz(m,t){ const e=$('durum'); e.className='durum'+(t?' '+t:''); e.textContent=m||''; }

/* YOL TAM UYMALI — sunucudaki kuralın aynısı.
   Önceki sürüm alt yolları da kabul ediyordu (`hy.startsWith(ky+'/')`),
   sunucu ise artık tam eşleşme istiyor. İki tarafın farklı kural
   uygulaması, panelin sunucunun kabul etmeyeceği kaydı önermesi demekti. */
function yolUyar(kayitUrl, hedefUrl){
  if(!kayitUrl) return true;
  try{
    const k=new URL(kayitUrl), h=new URL(hedefUrl);
    if(k.hostname.replace(/^www\./,'')!==h.hostname.replace(/^www\./,'')) return false;
    const ky=k.pathname.replace(/\/+$/,''); if(!ky) return true;
    return h.pathname.replace(/\/+$/,'')===ky;
  }catch(e){ return false; }
}

async function kapat(){ try{ await pencereApi.getCurrentWindow().hide(); }catch(e){} }

function hedefYaz(h){
  hedefSon = h;
  const n=$('nokta');
  if(!h||!h.program){
    n.className='nokta';
    $('hedefAd').textContent='Hedef bekleniyor';
    $('hedefAlt').textContent='Doldurulacak pencere öndeyken kısayola basın';
    return;
  }
  n.className='nokta canli';
  // Tarayıcıda Enter'ı eklenti değil sayfa yönetiyor; kutu anlamsız kalıyor.
  $('enterSatir').classList.toggle('gizli', !!h.tarayici);
  $('eklentiNot').classList.toggle('gizli', !h.tarayici);
  $('hedefAd').textContent = h.program;
  $('hedefAlt').textContent = h.url ? alanAdi(h.url)
    : ((h.baslik||'').trim()!==h.program ? (h.baslik||'').slice(0,48) : '');
}

function ciz(){
  const l=$('liste');

  /* TARAYICIDA DA TIKLANIR — İŞİ EKLENTİYE İLETİYORUZ.
     Bu panel tarayıcı hedefinde "doldurmayı eklenti yapıyor" diye bir metin
     gösteriyordu. Cevap değil bahaneydi: kullanıcı paneli görüyor, kaydı
     görüyor, tıklıyor ve hiçbir şey olmuyordu.
     Uygulama hâlâ tarayıcıya TUŞ GÖNDERMİYOR — sayfanın içini göremeyen bir
     program hangi kutunun ne olduğunu ancak tahmin eder. Tıklama köprüye
     iş bırakıyor, eklenti sayfayı GÖREREK dolduruyor. */
  if(!gosterilen.length){
    l.innerHTML='<div class="bos"><b>Bu pencereye uyan kayıt yok</b>'
      + 'Kasada bu adrese ait bir kayıt bulunamadı.</div>';
    secili=null;
    return;
  }
  if(!secili || !gosterilen.some(function(k){ return k.id===secili.id; })) secili = gosterilen[0];

  l.innerHTML = gosterilen.map(function(k){
    const ad=k.label||'(adsız)';
    const izinli = !Array.isArray(k.izinler) || k.izinler.indexOf('doldur')>=0;
    return '<button class="satir'+(secili&&secili.id===k.id?' secili':'')+'" data-id="'+k.id+'"'
      + (izinli?'':' disabled title="Bu kaydı doldurma yetkiniz yok"')+'>'
      + '<span class="avatar" style="background:'+renk(ad)+'">'+esc(basHarf(ad))+'</span>'
      + '<span class="metin"><span class="ad">'+esc(ad)+'</span>'
      + '<span class="alt">'+esc(k.username||k.domain||'—')+'</span></span>'
      + '<svg class="git" viewBox="0 0 24 24"><path d="M5 12h13"/><path d="m12 5 7 7-7 7"/></svg>'
      + '</button>';
  }).join('');

  // TEK TIK = DOLDUR. Seçmek için ayrı bir adım yok.
  Array.prototype.forEach.call(l.querySelectorAll('[data-id]'), function(el){
    el.onclick=function(){
      secili = gosterilen.filter(function(k){ return k.id==el.dataset.id; })[0] || null;
      doldur();
    };
    el.onmouseenter=function(){
      secili = gosterilen.filter(function(k){ return k.id==el.dataset.id; })[0] || secili;
      Array.prototype.forEach.call(l.querySelectorAll('.satir'), function(x){
        x.classList.toggle('secili', x===el);
      });
    };
  });
}

async function doldur(){
  if(dolduruluyor||!secili) return;
  dolduruluyor=true;
  durumYaz('Şifre alınıyor…');
  try{
    const s=await invoke('doldur',{id:secili.id, enterBas:$('enterKutu').checked});
    if(s.tamam){ await kapat(); durumYaz(''); }
    else durumYaz(s.mesaj,'hata');
  }catch(e){ durumYaz('Hata: '+e,'hata'); }
  finally{ dolduruluyor=false; }
}

$('kapat').onclick=kapat;

document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ e.preventDefault(); kapat(); return; }
  if(e.key==='Enter'){ e.preventDefault(); doldur(); return; }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(!gosterilen.length) return;
    e.preventDefault();
    let i=0;
    for(let j=0;j<gosterilen.length;j++) if(secili && gosterilen[j].id===secili.id) i=j;
    i = Math.min(gosterilen.length-1, Math.max(0, i + (e.key==='ArrowDown'?1:-1)));
    secili = gosterilen[i];
    ciz();
    const sec=$('liste').querySelector('.satir.secili');
    if(sec&&sec.scrollIntoView) sec.scrollIntoView({block:'nearest'});
  }
});

/* Panel her göründüğünde tazeleniyor.
   YALNIZ EŞLEŞENLER GÖSTERİLİYOR: bu panel zaten "bu pencereye uyan kayıt
   var" diye açılıyor. Bütün kasayı listeleyip kullanıcıya aratmak, panelin
   varlık sebebini ortadan kaldırırdı — o iş ana pencerenin. */
async function tazele(){
  try{ hedefYaz(await invoke('hedef')); }catch(e){}
  gosterilen=[]; secili=null; durumYaz('');

  if(hedefSon && hedefSon.url){
    try{
      const uyan = await invoke('eslesenler',{url:hedefSon.url});
      gosterilen = (uyan||[]).filter(function(k){ return yolUyar(k.url, hedefSon.url); }).slice(0,12);
    }catch(e){ gosterilen=[]; }
  } else if(hedefSon && !hedefSon.url){
    /* Masaüstü programında adres yok — eşleştirilecek bir şey de yok.
       Burada kullanıcının seçmesi gerekiyor, o yüzden hepsini gösteriyoruz. */
    try{ gosterilen = (await invoke('kayitlar')).slice(0,12); }catch(e){ gosterilen=[]; }
  }
  ciz();
}

listen('hizli-goster', tazele);
listen('hedef-degisti', function(o){ hedefYaz(o.payload); tazele(); });

tazele();
</script>
