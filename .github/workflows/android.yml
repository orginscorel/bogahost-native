name: Android (APK + AAB)

# Capacitor 7 Android kabuklarını derler.
# Her uygulama (finans/dcim/chat/task/muh) için ayrı APK + AAB üretir.
# İmzalama secret'ları varsa imzalanır; yoksa unsigned artifact üretilir (job FAIL etmez).

on:
  workflow_dispatch:
  push:
    branches:
      - native-apps
    tags:
      - 'v*'
  # release.yml bu workflow'u yeniden kullanabilsin diye:
  workflow_call:
    secrets:
      SIGNING_KEYSTORE_BASE64:
        required: false
      KEY_ALIAS:
        required: false
      STORE_PASSWORD:
        required: false
      KEY_PASSWORD:
        required: false
      DEPLOY_FTP_HOST:
        required: false
      DEPLOY_FTP_USER:
        required: false
      DEPLOY_FTP_PASS:
        required: false

permissions:
  contents: read

jobs:
  build-android:
    name: Android · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [finans, dcim, chat, task, muh]

    env:
      # Play Console her yüklemede ARTAN bir versionCode ister. run_number workflow
      # başına monoton artar. Gerekirse BUILD_NUMBER_OFFSET repo variable'ı ile kaydırılır.
      BUILD_NUMBER: ${{ github.run_number }}
      BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Capacitor 7 + AGP 8.x, Java 21 ile derlenir ("invalid source release: 21" hatasının sebebi).
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Kök bağımlılıklar: yalnızca scripts/ (gen-icons → sharp) + @capacitor/cli.
      - name: Install root dependencies
        run: npm install
      - name: Sürüm tutarlılığı denetimi
        run: node scripts/ci/check-versions.mjs

      # Per-app bağımlılıklar: @capacitor/android|core + eklentiler.
      # cap add/sync bunları gerektirir; kök npm install bunları KURMAZ.
      - name: Install app dependencies (${{ matrix.app }})
        working-directory: capacitor/${{ matrix.app }}
        run: npm install

      # Platformu üret (cap add) + override'ları kopyala + ikonları yerleştir
      # + versionName/versionCode yaz (mağaza şartı).
      # Taze checkout'ta android/ klasörü YOKTUR; bu adım onu oluşturur.
      - name: Prepare Android platform (cap add + overrides + icons + sürüm)
        run: node scripts/prepare.mjs --app ${{ matrix.app }} --platform android

      - name: Capacitor sync (android)
        working-directory: capacitor/${{ matrix.app }}
        run: npx cap sync android

      # GÜVENLİK AĞI: `cap sync` build.gradle'a dokunursa sürüm alanları geri gelsin.
      # İdempotenttir; değer zaten doğruysa dosyayı yazmaz.
      - name: Re-apply Android sürüm alanları
        run: node scripts/prepare.mjs --app ${{ matrix.app }} --platform android --step version

      - name: Detect signing secrets
        id: sign
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned build::SIGNING_KEYSTORE_BASE64 secret bulunamadı. ${{ matrix.app }} için İMZASIZ APK/AAB üretilecek (Play Store'a yüklenemez, yalnızca test)."
          fi

      - name: Decode keystore & write keystore.properties
        if: steps.sign.outputs.signed == 'true'
        working-directory: capacitor/${{ matrix.app }}/android
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "keystore.properties yazıldı (build.gradle bu dosya varsa release signingConfig'i devreye alır)."

      - name: Gradle assembleRelease + bundleRelease
        working-directory: capacitor/${{ matrix.app }}/android
        run: |
          chmod +x ./gradlew || true
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect artifacts
        id: collect
        working-directory: capacitor/${{ matrix.app }}/android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find app/build/outputs/apk -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \; 2>/dev/null || true
          find app/build/outputs/bundle -name '*.aab' -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \; 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/artifacts" || true

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.app }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Yayınlama — APK → native.bogahost.com/downloads/ (yalnızca indirme linki)
  # Android'de OTOMATİK GÜNCELLEME YOKTUR; kullanıcı APK'yı elle kurar.
  # DEPLOY_FTP_* secret'ları yoksa ATLANIR (uyarı verir, iş başarısız OLMAZ).
  # ---------------------------------------------------------------------------
  publish-android:
    name: Yayınla · Android
    needs: build-android
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy secret denetimi
        id: det
        env:
          H: ${{ secrets.DEPLOY_FTP_HOST }}
          U: ${{ secrets.DEPLOY_FTP_USER }}
          P: ${{ secrets.DEPLOY_FTP_PASS }}
        run: |
          if [ -n "$H" ] && [ -n "$U" ] && [ -n "$P" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Yayin atlandi::DEPLOY_FTP_HOST/USER/PASS eksik — APK yuklenmedi (docs/UPDATE.md)."
          fi

      - name: Artifact'ları indir
        if: steps.det.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: android-*

      - name: Sürümü belirle
        if: steps.det.outputs.ok == 'true'
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: downloads ağacını üret
        if: steps.det.outputs.ok == 'true'
        run: |
          node scripts/ci/publish-updates.mjs \
            --artifacts dist \
            --out out \
            --platform android \
            --version "${{ steps.ver.outputs.version }}"
          find out -type f | sort

      - name: lftp kur
        if: steps.det.outputs.ok == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: FTPS ile yükle
        if: steps.det.outputs.ok == 'true'
        env:
          FTP_HOST: ${{ secrets.DEPLOY_FTP_HOST }}
          FTP_USER: ${{ secrets.DEPLOY_FTP_USER }}
          FTP_PASS: ${{ secrets.DEPLOY_FTP_PASS }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:use-site-chmod false;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:timeout 20;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            mirror -R --no-perms --verbose --parallel=2 out/ ./;
            bye
          "
          echo "Yuklendi → https://native.bogahost.com/"
