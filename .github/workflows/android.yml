name: Android (APK + AAB)

# Capacitor 7 Android kabuklarını derler.
# Her uygulama (finans/dcim/chat/task/muh) için ayrı APK + AAB üretir.
# İmzalama secret'ları varsa imzalanır; yoksa unsigned artifact üretilir (job FAIL etmez).

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Hangi uygulama derlensin? (hepsi / finans / dcim / chat / task / muh)'
        required: false
        default: 'hepsi'
  push:
    branches:
      - native-apps
    tags:
      - 'v*'
  # release.yml bu workflow'u yeniden kullanabilsin diye:
  workflow_call:
    secrets:
      SIGNING_KEYSTORE_BASE64:
        required: false
      KEY_ALIAS:
        required: false
      STORE_PASSWORD:
        required: false
      KEY_PASSWORD:
        required: false
      DEPLOY_FTP_HOST:
        required: false
      DEPLOY_FTP_USER:
        required: false
      DEPLOY_FTP_PASS:
        required: false

permissions:
  contents: read

jobs:
  # Hangi uygulamalar derlenecek?
  #
  # NEDEN: burada sabit bir matris vardı ve HER İTMEDE beş uygulama birden
  # derleniyordu. Yalnız masaüstü Kasa'ya dokunan bir commit bile beş Android
  # derlemesi başlatıyordu — tamamı boşuna. macOS ve Windows akışlarındaki
  # denetimin aynısı buraya da geldi.
  #
  # Kasa listede YOK: küresel kısayol, öndeki pencereyi okuma ve başka
  # programa tuş gönderme gerektiriyor; mobilde bu yetenekler yok.
  degisenler:
    name: Değişenleri belirle
    runs-on: ubuntu-latest
    outputs:
      liste: ${{ steps.hesapla.outputs.liste }}
      var: ${{ steps.hesapla.outputs.var }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Hesapla
        id: hesapla
        shell: bash
        run: |
          TUM='["finans","dcim","chat","task","muh"]'

          # ELLE TETİKLEMEDE TEK UYGULAMA SEÇİLEBİLİR.
          SEC='${{ github.event.inputs.app }}'
          if [ -n "$SEC" ] && [ "$SEC" != "hepsi" ]; then
            case "$SEC" in
              finans|dcim|chat|task|muh)
                echo "Elle tetikleme → yalnız $SEC"
                echo "liste=[\"$SEC\"]" >> "$GITHUB_OUTPUT"; echo "var=1" >> "$GITHUB_OUTPUT"; exit 0 ;;
              kasa)
                echo "::error title=Kasa mobilde yok::Kasa yalnız masaüstüdür."; exit 1 ;;
              *)
                echo "::error title=Bilinmeyen uygulama::'$SEC' diye bir uygulama yok."; exit 1 ;;
            esac
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
          || [ "${{ github.event_name }}" = "workflow_call" ] \
          || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Elle tetikleme / sürüm etiketi → hepsi"
            echo "liste=$TUM" >> "$GITHUB_OUTPUT"; echo "var=1" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "Kıyaslanacak önceki commit yok → hepsi"
            echo "liste=$TUM" >> "$GITHUB_OUTPUT"; echo "var=1" >> "$GITHUB_OUTPUT"; exit 0
          fi

          FARK=$(git diff --name-only HEAD~1 HEAD)
          echo "Değişen dosyalar:"; echo "$FARK" | sed 's/^/  /'

          # Ortak dosyalar hepsini etkiliyor. Başka platformun akış dosyası
          # ETKİLEMİYOR — bu yüzden yalnız kendi dosyamıza bakıyoruz.
          if echo "$FARK" | grep -qE '^(scripts/|apps\.config\.json|package\.json|assets/|pwa-enhancements/|\.github/workflows/android\.yml)'; then
            echo "Ortak dosya değişti → hepsi"
            echo "liste=$TUM" >> "$GITHUB_OUTPUT"; echo "var=1" >> "$GITHUB_OUTPUT"; exit 0
          fi

          SECIM=""
          for A in finans dcim chat task muh; do
            if echo "$FARK" | grep -q "^capacitor/$A/"; then SECIM="$SECIM \"$A\""; fi
          done
          SECIM=$(echo $SECIM | tr ' ' ',')

          if [ -z "$SECIM" ]; then
            echo "::notice title=Derleme yok::Hiçbir mobil uygulama klasörü değişmedi; Android derlemesi atlandı."
            echo "liste=[]" >> "$GITHUB_OUTPUT"; echo "var=0" >> "$GITHUB_OUTPUT"
          else
            echo "Derlenecek: [$SECIM]"
            echo "liste=[$SECIM]" >> "$GITHUB_OUTPUT"; echo "var=1" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    name: Android · ${{ matrix.app }}
    needs: degisenler
    if: needs.degisenler.outputs.var == '1'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # AYNI ANDA EN FAZLA İKİ İŞ.
      # Beş Android işi paralel koşunca hepsi aynı çıkış IP'sinden Maven
      # Central'a yükleniyor ve depo 429 (Too Many Requests) döndürüyordu.
      # İkiye indirmek istek yoğunluğunu düşürüyor; toplam süre biraz uzuyor
      # ama düşen derleme yeniden koşturmaktan ucuz.
      max-parallel: 2
      matrix:
        app: ${{ fromJson(needs.degisenler.outputs.liste) }}

    env:
      # Play Console her yüklemede ARTAN bir versionCode ister. run_number workflow
      # başına monoton artar. Gerekirse BUILD_NUMBER_OFFSET repo variable'ı ile kaydırılır.
      BUILD_NUMBER: ${{ github.run_number }}
      BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Capacitor 7 + AGP 8.x, Java 21 ile derlenir ("invalid source release: 21" hatasının sebebi).
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GRADLE ÖNBELLEĞİ — 429'un asıl panzehiri.
      # Yeniden deneme geçici sınırı aşmayı sağlıyor ama asıl çözüm depoya
      # HİÇ GİTMEMEK. Bağımlılıklar önbellekten gelince Maven Central'a atılan
      # istek sayısı bir avuca iniyor; hız sınırı da doğal olarak tetiklenmiyor.
      # Anahtar gradle dosyalarının özetinden türüyor: bağımlılık değişmedikçe
      # aynı önbellek kullanılıyor.
      - name: Gradle önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles('capacitor/*/android/**/*.gradle*', 'capacitor/*/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.app }}-
            gradle-${{ runner.os }}-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Kök bağımlılıklar: yalnızca scripts/ (gen-icons → sharp) + @capacitor/cli.
      - name: Install root dependencies
        run: npm install
      - name: Sürüm tutarlılığı denetimi
        run: node scripts/ci/check-versions.mjs

      # Per-app bağımlılıklar: @capacitor/android|core + eklentiler.
      # cap add/sync bunları gerektirir; kök npm install bunları KURMAZ.
      - name: Install app dependencies (${{ matrix.app }})
        working-directory: capacitor/${{ matrix.app }}
        run: npm install

      # Platformu üret (cap add) + override'ları kopyala + ikonları yerleştir
      # + versionName/versionCode yaz (mağaza şartı).
      # Taze checkout'ta android/ klasörü YOKTUR; bu adım onu oluşturur.
      - name: Prepare Android platform (cap add + overrides + icons + sürüm)
        run: node scripts/prepare.mjs --app ${{ matrix.app }} --platform android

      - name: Capacitor sync (android)
        working-directory: capacitor/${{ matrix.app }}
        run: npx cap sync android

      # GÜVENLİK AĞI: `cap sync` build.gradle'a dokunursa sürüm alanları geri gelsin.
      # İdempotenttir; değer zaten doğruysa dosyayı yazmaz.
      - name: Re-apply Android sürüm alanları
        run: node scripts/prepare.mjs --app ${{ matrix.app }} --platform android --step version

      - name: Detect signing secrets
        id: sign
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned build::SIGNING_KEYSTORE_BASE64 secret bulunamadı. ${{ matrix.app }} için İMZASIZ APK/AAB üretilecek (Play Store'a yüklenemez, yalnızca test)."
          fi

      - name: Decode keystore & write keystore.properties
        if: steps.sign.outputs.signed == 'true'
        working-directory: capacitor/${{ matrix.app }}/android
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "keystore.properties yazıldı (build.gradle bu dosya varsa release signingConfig'i devreye alır)."

      - name: Gradle assembleRelease + bundleRelease
        working-directory: capacitor/${{ matrix.app }}/android
        run: |
          chmod +x ./gradlew || true

          # NEDEN YENİDEN DENEME:
          # Derlemeler "Could not resolve ... Received status code 429 from
          # server: Too Many Requests" ile düşüyordu. Bu bir KOD HATASI DEĞİL —
          # Maven Central'ın hız sınırı. Aynı anda koşan işler aynı çıkış
          # IP'sinden aynı depoyu çekince sınır tetikleniyor ve rastgele bir iş
          # kurban gidiyor.
          #
          # Üç deneme, artan bekleme. Kalıcı bir hata (derleme hatası, imza
          # sorunu) üç denemede de aynı şekilde düşer; sadece geçici olan
          # kurtulur. Bekleme süreleri sınırın sıfırlanmasına yetecek kadar.
          for DENEME in 1 2 3; do
            if ./gradlew --no-daemon assembleRelease bundleRelease; then
              echo "Gradle $DENEME. denemede tamamlandı."
              exit 0
            fi
            if [ "$DENEME" -lt 3 ]; then
              BEKLE=$((DENEME * 45))
              echo "::warning title=Gradle yeniden deneniyor::${DENEME}. deneme düştü, ${BEKLE} sn sonra tekrar."
              sleep "$BEKLE"
            fi
          done
          echo "::error title=Gradle::Üç denemede de tamamlanamadı."
          exit 1

      - name: Collect artifacts
        id: collect
        working-directory: capacitor/${{ matrix.app }}/android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find app/build/outputs/apk -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \; 2>/dev/null || true
          find app/build/outputs/bundle -name '*.aab' -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \; 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/artifacts" || true

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.app }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Yayınlama — APK → native.bogahost.com/downloads/ (yalnızca indirme linki)
  # Android'de OTOMATİK GÜNCELLEME YOKTUR; kullanıcı APK'yı elle kurar.
  # DEPLOY_FTP_* secret'ları yoksa ATLANIR (uyarı verir, iş başarısız OLMAZ).
  # ---------------------------------------------------------------------------
  publish-android:
    name: Yayınla · Android
    needs: [degisenler, build-android]
    # always(): imzasız/kısmi derlemelerde de elde olanı yayınlıyoruz.
    # Ama HİÇBİR uygulama derlenmediyse yayınlanacak bir şey de yok.
    if: always() && needs.degisenler.outputs.var == '1' 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy secret denetimi
        id: det
        env:
          H: ${{ secrets.DEPLOY_FTP_HOST }}
          U: ${{ secrets.DEPLOY_FTP_USER }}
          P: ${{ secrets.DEPLOY_FTP_PASS }}
        run: |
          if [ -n "$H" ] && [ -n "$U" ] && [ -n "$P" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Yayin atlandi::DEPLOY_FTP_HOST/USER/PASS eksik — APK yuklenmedi (docs/UPDATE.md)."
          fi

      - name: Artifact'ları indir
        if: steps.det.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: android-*

      - name: Sürümü belirle
        if: steps.det.outputs.ok == 'true'
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: downloads ağacını üret
        if: steps.det.outputs.ok == 'true'
        run: |
          node scripts/ci/publish-updates.mjs \
            --artifacts dist \
            --out out \
            --platform android \
            --version "${{ steps.ver.outputs.version }}"
          find out -type f | sort

      - name: lftp kur
        if: steps.det.outputs.ok == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: FTPS ile yükle
        if: steps.det.outputs.ok == 'true'
        env:
          FTP_HOST: ${{ secrets.DEPLOY_FTP_HOST }}
          FTP_USER: ${{ secrets.DEPLOY_FTP_USER }}
          FTP_PASS: ${{ secrets.DEPLOY_FTP_PASS }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:use-site-chmod false;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:timeout 20;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            mirror -R --no-perms --verbose --parallel=2 out/ ./;
            bye
          "
          echo "Yuklendi → https://native.bogahost.com/"
