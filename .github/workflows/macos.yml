name: macOS (DMG + App)

# Tauri 2 macOS kabuklarını derler.
# Her uygulama için .dmg + .app (tar.gz) üretir.
# Developer ID sertifikası + notarization secret'ları VARSA imzalanır/notarize edilir;
# yoksa unsigned artifact üretilir (Gatekeeper "doğrulanamadı" uyarısı verir).
# TAURI_SIGNING_* secret'ları VARSA updater artifact'ları (.app.tar.gz + .sig) üretilir ve
# DEPLOY_FTP_* secret'ları VARSA native.bogahost.com'a yayınlanır (publish job).

on:
  workflow_dispatch:
  push:
    branches:
      - native-apps
    tags:
      - 'v*'
  workflow_call:
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      TAURI_SIGNING_PUBLIC_KEY:
        required: false
      DEPLOY_FTP_HOST:
        required: false
      DEPLOY_FTP_USER:
        required: false
      DEPLOY_FTP_PASS:
        required: false

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS · ${{ matrix.app }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [finans, dcim, chat, task]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable + apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/${{ matrix.app }}/src-tauri

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Per-app Tauri bağımlılıkları (@tauri-apps/cli).
      - name: Install app dependencies (${{ matrix.app }})
        working-directory: tauri/${{ matrix.app }}
        run: npm install

      # src-tauri/icons/ ikon klasörünü doldurur (icon.icns dahil).
      - name: Generate Tauri icons
        working-directory: tauri/${{ matrix.app }}
        run: npx tauri icon ../../assets/icons/icon-source-${{ matrix.app }}.png

      # Updater public key'i tauri.conf.json'a yazar ve createUpdaterArtifacts'i açar.
      # Secret yoksa DOKUNMAZ → build bugünkü (yeşil) davranışıyla birebir aynı kalır.
      - name: Updater yapılandırması (secret varsa)
        env:
          PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          PRIVKEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVKEY" ]; then
            echo "::warning title=Updater kapali::TAURI_SIGNING_PRIVATE_KEY yok — imzali updater artifact URETILMEYECEK (docs/UPDATE.md)."
            exit 0
          fi
          node scripts/ci/apply-updater-config.mjs --app "${{ matrix.app }}" --pubkey "$PUBKEY"

      - name: Detect signing secrets
        id: sign
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$CERT" ] && [ -n "$IDENTITY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned macOS build::APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY eksik. ${{ matrix.app }} için imzasız/notarize edilmemiş DMG üretildi (Gatekeeper uyarısı). Dağıtım için docs/SIGNING.md."
          fi

      # ÖNEMLİ: APPLE_* env değişkenleri BOŞ da olsa TANIMLIYSA Tauri codesign dener ve
      # "failed to import keychain certificate" ile patlar. Bu yüzden imzasız yolda bu
      # değişkenler HİÇ tanımlanmaz — iki ayrı adım.
      # Aynı tuzak TAURI_SIGNING_PRIVATE_KEY için de geçerlidir; o yüzden alt çizgili
      # değişkenden YALNIZCA DOLUYSA export edilir.
      - name: Tauri build (imzasız)
        if: steps.sign.outputs.signed == 'false'
        working-directory: tauri/${{ matrix.app }}
        env:
          _TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          _TAURI_KEY_PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$_TAURI_KEY" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$_TAURI_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$_TAURI_KEY_PW"
            echo "Updater imzalama: ACIK"
          else
            echo "Updater imzalama: KAPALI"
          fi
          npm run tauri:build:mac

      - name: Tauri build (imzalı + notarize)
        if: steps.sign.outputs.signed == 'true'
        working-directory: tauri/${{ matrix.app }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          _TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          _TAURI_KEY_PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$_TAURI_KEY" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$_TAURI_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$_TAURI_KEY_PW"
            echo "Updater imzalama: ACIK"
          else
            echo "Updater imzalama: KAPALI"
          fi
          npm run tauri:build:mac

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          BUNDLE="tauri/${{ matrix.app }}/src-tauri/target/release/bundle"
          find "$BUNDLE/dmg" -name '*.dmg' -exec cp {} artifacts/ \; 2>/dev/null || true

          # Tauri, createUpdaterArtifacts açıkken .app.tar.gz + .sig üretir.
          # VARSA onu kullan (imzalı); YOKSA eski davranış: .app'i elle tarla (imzasız).
          if ls "$BUNDLE/macos"/*.app.tar.gz >/dev/null 2>&1; then
            cp "$BUNDLE/macos"/*.app.tar.gz artifacts/ || true
            cp "$BUNDLE/macos"/*.app.tar.gz.sig artifacts/ 2>/dev/null || true
            echo "Tauri updater paketi bulundu (imzali)."
          elif [ -d "$BUNDLE/macos" ]; then
            for appdir in "$BUNDLE/macos"/*.app; do
              [ -e "$appdir" ] || continue
              base="$(basename "$appdir" .app)"
              tar -czf "artifacts/${base}-${{ matrix.app }}.app.tar.gz" -C "$BUNDLE/macos" "$(basename "$appdir")"
            done
            echo "::warning title=Updater paketi yok::${{ matrix.app }} — .app elle tarlandi (.sig YOK, otomatik guncelleme yayinlanmaz)."
          fi

          # Üretilen binary'nin mimarisi (universal ise iki değer).
          # publish job bu dosyaya bakarak latest.json'daki platform anahtarlarını seçer.
          APPDIR="$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' 2>/dev/null | head -1)"
          ARCHS="aarch64"
          if [ -n "$APPDIR" ]; then
            EXE="$(find "$APPDIR/Contents/MacOS" -type f 2>/dev/null | head -1)"
            if [ -n "$EXE" ]; then
              DETECTED="$(lipo -archs "$EXE" 2>/dev/null | tr ' ' '\n' | sed 's/^arm64$/aarch64/' | tr '\n' ' ' | xargs || true)"
              [ -n "$DETECTED" ] && ARCHS="$DETECTED"
            fi
          fi
          echo "$ARCHS" > artifacts/updater-archs.txt
          echo "Mimari: $ARCHS"
          ls -la artifacts || true

      - name: Upload DMG + App
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.app }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Yayınlama — .app.tar.gz + .sig + dmg + latest.json → native.bogahost.com (FTPS)
  # DEPLOY_FTP_* secret'ları yoksa ATLANIR (uyarı verir, iş başarısız OLMAZ).
  # ---------------------------------------------------------------------------
  publish-macos:
    name: Yayınla · macOS
    needs: build-macos
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy secret denetimi
        id: det
        env:
          H: ${{ secrets.DEPLOY_FTP_HOST }}
          U: ${{ secrets.DEPLOY_FTP_USER }}
          P: ${{ secrets.DEPLOY_FTP_PASS }}
        run: |
          if [ -n "$H" ] && [ -n "$U" ] && [ -n "$P" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Yayin atlandi::DEPLOY_FTP_HOST/USER/PASS eksik — native.bogahost.com'a yukleme YAPILMADI (docs/UPDATE.md)."
          fi

      - name: Artifact'ları indir
        if: steps.det.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: macos-*

      - name: Sürümü belirle
        if: steps.det.outputs.ok == 'true'
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Yayinlanacak surum: $V"

      - name: latest.json + downloads ağacını üret
        if: steps.det.outputs.ok == 'true'
        run: |
          node scripts/ci/publish-updates.mjs \
            --artifacts dist \
            --out out \
            --platform macos \
            --version "${{ steps.ver.outputs.version }}"
          find out -type f | sort

      - name: lftp kur
        if: steps.det.outputs.ok == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # FTPS (açık TLS / AUTH TLS). Hedef dizin FTP kullanıcısının kökü = public_html/native.
      # --delete KULLANILMAZ: eski sürüm dosyaları ve diğer platformun kayıtları silinmez.
      - name: FTPS ile yükle
        if: steps.det.outputs.ok == 'true'
        env:
          FTP_HOST: ${{ secrets.DEPLOY_FTP_HOST }}
          FTP_USER: ${{ secrets.DEPLOY_FTP_USER }}
          FTP_PASS: ${{ secrets.DEPLOY_FTP_PASS }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:timeout 20;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            mirror -R --verbose --parallel=2 out/ ./;
            bye
          "
          echo "Yuklendi → https://native.bogahost.com/"
